<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="xpTitle xpDesc" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="xpTitle">Secure offshore tax preparation architecture</title>
  <desc id="xpDesc">Client tax data remained on United States infrastructure. Certified chartered accountants in India accessed it through encrypted remote terminal sessions with no downloads, no file transfers, no screen capture and no printing, so the data never left the United States.</desc>

  <rect width="900" height="470" fill="#F4F6F9"/>

  <!-- UNITED STATES PANEL -->
  <rect x="34" y="52" width="330" height="300" rx="8" fill="#0B1F3A"/>
  <text x="58" y="84" font-size="11" font-weight="600" letter-spacing="2.2" fill="#00AEEF">UNITED STATES</text>
  <text x="58" y="106" font-size="13" fill="#8A9BB0">Data resides here. Always.</text>

  <rect x="58" y="126" width="282" height="56" rx="5" fill="#122847" stroke="#2A5F8F"/>
  <text x="74" y="150" font-size="14" font-weight="600" fill="#FFFFFF">Client tax data</text>
  <text x="74" y="169" font-size="12" fill="#8A9BB0">SSNs, financial records, returns</text>

  <rect x="58" y="194" width="282" height="56" rx="5" fill="#122847" stroke="#2A5F8F"/>
  <text x="74" y="218" font-size="14" font-weight="600" fill="#FFFFFF">Citrix hosted environment</text>
  <text x="74" y="237" font-size="12" fill="#8A9BB0">US based servers and applications</text>

  <rect x="58" y="262" width="282" height="56" rx="5" fill="#122847" stroke="#2A5F8F"/>
  <text x="74" y="286" font-size="14" font-weight="600" fill="#FFFFFF">Access control and audit</text>
  <text x="74" y="305" font-size="12" fill="#8A9BB0">Session logging, no local persistence</text>

  <!-- BOUNDARY -->
  <line x1="450" y1="46" x2="450" y2="358" stroke="#00AEEF" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="404" y="34" width="92" height="24" rx="12" fill="#00AEEF"/>
  <text x="450" y="51" font-size="10" font-weight="700" letter-spacing="1.4" fill="#0B1F3A" text-anchor="middle">BOUNDARY</text>

  <!-- ALLOWED SESSION -->
  <line x1="372" y1="152" x2="528" y2="152" stroke="#00AEEF" stroke-width="2"/>
  <polygon points="528,152 518,147 518,157" fill="#00AEEF"/>
  <polygon points="372,152 382,147 382,157" fill="#00AEEF"/>
  <text x="450" y="138" font-size="11" font-weight="600" fill="#0099D4" text-anchor="middle">Encrypted screen session</text>
  <text x="450" y="176" font-size="11" fill="#5A6E83" text-anchor="middle">Pixels move. Files do not.</text>

  <!-- BLOCKED TRANSFER -->
  <line x1="372" y1="258" x2="528" y2="258" stroke="#B4BFCB" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="450" cy="258" r="13" fill="#F4F6F9" stroke="#C0392B" stroke-width="2"/>
  <line x1="444" y1="252" x2="456" y2="264" stroke="#C0392B" stroke-width="2"/>
  <line x1="456" y1="252" x2="444" y2="264" stroke="#C0392B" stroke-width="2"/>
  <text x="450" y="292" font-size="11" font-weight="600" fill="#8A9BB0" text-anchor="middle">No data transfer path</text>

  <!-- INDIA PANEL -->
  <rect x="536" y="52" width="330" height="300" rx="8" fill="#FFFFFF" stroke="#D5DDE6"/>
  <text x="560" y="84" font-size="11" font-weight="600" letter-spacing="2.2" fill="#2A5F8F">INDIA</text>
  <text x="560" y="106" font-size="13" fill="#5A6E83">Work happens here. Data does not.</text>

  <rect x="560" y="126" width="282" height="56" rx="5" fill="#F4F6F9" stroke="#D5DDE6"/>
  <text x="576" y="150" font-size="14" font-weight="600" fill="#0B1F3A">Certified chartered accountants</text>
  <text x="576" y="169" font-size="12" fill="#5A6E83">Trained in US tax law</text>

  <rect x="560" y="194" width="282" height="56" rx="5" fill="#F4F6F9" stroke="#D5DDE6"/>
  <text x="576" y="218" font-size="14" font-weight="600" fill="#0B1F3A">Dummy remote terminals</text>
  <text x="576" y="237" font-size="12" fill="#5A6E83">No local storage, no removable media</text>

  <rect x="560" y="262" width="282" height="56" rx="5" fill="#F4F6F9" stroke="#D5DDE6"/>
  <text x="576" y="286" font-size="14" font-weight="600" fill="#0B1F3A">Paperless, device free floor</text>
  <text x="576" y="305" font-size="12" fill="#5A6E83">Controlled physical environment</text>

  <!-- CONTROLS STRIP -->
  <rect x="34" y="378" width="832" height="58" rx="6" fill="#0B1F3A"/>
  <text x="58" y="404" font-size="10" font-weight="600" letter-spacing="2" fill="#00AEEF">ENFORCED CONTROLS</text>
  <circle cx="62" cy="422" r="3" fill="#00AEEF"/>
  <text x="74" y="426" font-size="12.5" fill="#FFFFFF">No downloads</text>
  <circle cx="194" cy="422" r="3" fill="#00AEEF"/>
  <text x="206" y="426" font-size="12.5" fill="#FFFFFF">No file transfers</text>
  <circle cx="338" cy="422" r="3" fill="#00AEEF"/>
  <text x="350" y="426" font-size="12.5" fill="#FFFFFF">No screen capture</text>
  <circle cx="494" cy="422" r="3" fill="#00AEEF"/>
  <text x="506" y="426" font-size="12.5" fill="#FFFFFF">No printing</text>
  <text x="842" y="426" font-size="12.5" font-weight="600" fill="#00AEEF" text-anchor="end">Zero incidents across two full seasons</text>
</svg>
