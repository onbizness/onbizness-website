<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="hTitle hDesc" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hTitle">Connected work hierarchy from team backlog to enterprise strategy</title>
  <desc id="hDesc">Stories and epics managed in Jira roll up through sub initiatives, initiatives, themes and focus areas in Jira Align, giving leadership visibility from the boardroom to the backlog across 700 teams.</desc>

  <rect width="900" height="520" fill="#F4F6F9"/>

  <!-- AUDIENCE MARKERS -->
  <text x="756" y="70" font-size="10" font-weight="600" letter-spacing="1.8" fill="#00AEEF">BOARDROOM</text>
  <text x="756" y="448" font-size="10" font-weight="600" letter-spacing="1.8" fill="#8A9BB0">BACKLOG</text>

  <!-- ROLL UP ARROW -->
  <line x1="738" y1="430" x2="738" y2="92" stroke="#00AEEF" stroke-width="2"/>
  <polygon points="738,82 732,96 744,96" fill="#00AEEF"/>
  <text x="726" y="300" font-size="11" font-weight="600" fill="#0099D4" text-anchor="middle" transform="rotate(-90 726 300)">Delivery rolls up to strategy</text>

  <!-- CASCADE ARROW -->
  <line x1="160" y1="92" x2="160" y2="430" stroke="#8A9BB0" stroke-width="2"/>
  <polygon points="160,440 154,426 166,426" fill="#8A9BB0"/>
  <text x="148" y="262" font-size="11" fill="#5A6E83" text-anchor="middle" transform="rotate(-90 148 262)">Strategy cascades into daily work</text>

  <!-- PLATFORM BRACKETS -->
  <rect x="34" y="78" width="76" height="230" rx="5" fill="#0B1F3A"/>
  <text x="72" y="188" font-size="12" font-weight="600" fill="#00AEEF" text-anchor="middle" transform="rotate(-90 72 188)">JIRA ALIGN</text>

  <rect x="34" y="320" width="76" height="126" rx="5" fill="#2A5F8F"/>
  <text x="72" y="383" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 72 383)">JIRA</text>

  <!-- LEVEL 1 FOCUS AREAS -->
  <rect x="266" y="78" width="352" height="52" rx="5" fill="#0B1F3A"/>
  <text x="290" y="101" font-size="14" font-weight="600" fill="#FFFFFF">Focus Areas</text>
  <text x="290" y="119" font-size="11.5" fill="#8A9BB0">Enterprise strategic direction</text>

  <!-- LEVEL 2 THEMES -->
  <rect x="248" y="138" width="388" height="52" rx="5" fill="#122847"/>
  <text x="272" y="161" font-size="14" font-weight="600" fill="#FFFFFF">Themes</text>
  <text x="272" y="179" font-size="11.5" fill="#8A9BB0">Investment categories under each focus area</text>

  <!-- LEVEL 3 INITIATIVES -->
  <rect x="230" y="198" width="424" height="52" rx="5" fill="#1C3A5E"/>
  <text x="254" y="221" font-size="14" font-weight="600" fill="#FFFFFF">Initiatives</text>
  <text x="254" y="239" font-size="11.5" fill="#9FB2C6">Funded programs of work</text>

  <!-- LEVEL 4 SUB INITIATIVES -->
  <rect x="212" y="258" width="460" height="52" rx="5" fill="#2A5F8F"/>
  <text x="236" y="281" font-size="14" font-weight="600" fill="#FFFFFF">Sub Initiatives</text>
  <text x="236" y="299" font-size="11.5" fill="#C3D4E4">Deliverable slices owned by programs</text>

  <!-- LEVEL 5 EPICS -->
  <rect x="194" y="318" width="496" height="52" rx="5" fill="#6E8CA8"/>
  <text x="218" y="341" font-size="14" font-weight="600" fill="#FFFFFF">Epics</text>
  <text x="218" y="359" font-size="11.5" fill="#EAF1F7">Team level bodies of work</text>

  <!-- LEVEL 6 STORIES -->
  <rect x="176" y="378" width="532" height="52" rx="5" fill="#AFC0D0"/>
  <text x="200" y="401" font-size="14" font-weight="600" fill="#0B1F3A">Stories</text>
  <text x="200" y="419" font-size="11.5" fill="#22415F">Sprint level execution across 700 teams</text>

  <!-- FOOTER STRIP -->
  <rect x="34" y="458" width="832" height="40" rx="5" fill="#FFFFFF" stroke="#D5DDE6"/>
  <circle cx="62" cy="478" r="3" fill="#00AEEF"/>
  <text x="74" y="482" font-size="12.5" fill="#0B1F3A">700+ teams onboarded</text>
  <circle cx="254" cy="478" r="3" fill="#00AEEF"/>
  <text x="266" y="482" font-size="12.5" fill="#0B1F3A">6 domains</text>
  <circle cx="374" cy="478" r="3" fill="#00AEEF"/>
  <text x="386" y="482" font-size="12.5" fill="#0B1F3A">250+ squads</text>
  <text x="842" y="482" font-size="12.5" font-weight="600" fill="#0099D4" text-anchor="end">Every story traceable to a strategic priority</text>
</svg>
